<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101d">
  <title>深圳交通探索器</title>
  <link rel="stylesheet" href="/static/css/internal.css">
</head>
<body class="fusion-home">
  <main class="fusion-shell">
    <header class="fusion-header">
      <span class="fusion-kicker">SHENZHEN TRANSIT EXPLORER</span>
      <h1>公交与地铁，<br>一套工具完整探索。</h1>
      <p>统一采集、线网浏览、站名学习与公开发布；网络领域平行，产品运行时共享。</p>
    </header>
    <section class="network-choice" aria-label="选择交通网络">
      <a class="network-choice-card bus" href="/bus">
        <span class="choice-mark">巴</span><small>BUS NETWORK</small><strong>深圳公交</strong>
        <p>全市方向线路、站点聚合、采集复核与逐站学习。</p><b>进入公交 →</b>
      </a>
      <a class="network-choice-card metro" href="/metro">
        <span class="choice-mark">轨</span><small>METRO NETWORK</small><strong>深圳地铁</strong>
        <p>真实地理线网、八方向示意、共享换乘锚点与学习。</p><b>进入地铁 →</b>
      </a>
    </section>
    <nav class="fusion-actions">
      <a href="/bus/collector">公交采集</a><a href="/metro/collector">地铁采集</a>
      <a href="/bus/learn">公交学习</a><a href="/metro/learn">地铁学习</a><a href="/studio">示意工作台</a>
    </nav>
  </main>
</body>
</html>
