[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shenzhen-transit-explorer"
version = "3.0.0"
description = "Unified Shenzhen bus and metro collection, learning and public publishing toolkit"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.13,<5",
  "python-dotenv>=1.0,<2",
  "pypinyin>=0.53,<1",
  "httpx>=0.27,<1",
  "Pillow>=11,<13",
]

[project.scripts]
transit-explorer = "transit_explorer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
